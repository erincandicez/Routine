<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --paper:#EDF1EC; --card:#F6F8F5; --ink:#25332D; --soft:#63736A;
    --faint:#98A69D; --line:#DCE3DB; --done:#6E9A6B; --am:#B0842E; --pm:#8195BC;
  }
  html,body { margin:0; background:var(--paper); }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink);
    padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
  #app { max-width:480px; margin:0 auto; padding:20px 18px 44px; }
  .header { border-radius:26px; padding:22px 22px 20px; }
  .eyebrow { font-size:11px; letter-spacing:2px; text-transform:uppercase; font-weight:600; }
  .day { font-family:Georgia,"Times New Roman",serif; font-size:34px; line-height:1.1; margin-top:6px; }
  .date { font-size:13px; margin-top:4px; }
  .treat { margin-top:16px; display:flex; align-items:center; gap:8px; border-radius:14px; padding:10px 12px; }
  .treat .lab { font-size:14px; font-weight:600; }
  .treat .det { font-size:12px; }
  .streak { display:flex; align-items:center; gap:6px; margin-top:14px; font-size:13px; font-weight:600; }
  .toggle { display:flex; gap:8px; margin-top:16px; }
  .toggle button { flex:1; padding:11px 0; border-radius:13px; cursor:pointer; font-size:14px;
    font-weight:600; letter-spacing:.3px; border:1.5px solid var(--line); background:var(--card); color:var(--soft); }
  .toggle button.on-am { border-color:var(--am); background:var(--am); color:#F6F8F5; }
  .toggle button.on-pm { border-color:var(--pm); background:var(--pm); color:#F6F8F5; }
  .prog { display:flex; align-items:center; gap:10px; margin:18px 4px 12px; }
  .bar { flex:1; height:5px; border-radius:999px; background:var(--line); overflow:hidden; }
  .fill { height:100%; border-radius:999px; transition:width .2s ease; }
  .count { font-size:12px; color:var(--soft); font-variant-numeric:tabular-nums; }
  .sec { margin-top:16px; }
  .sec-h { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; font-weight:700; color:var(--faint); margin:0 6px 7px; }
  .list { background:var(--card); border-radius:18px; border:1px solid var(--line); overflow:hidden; }
  .row { width:100%; display:flex; align-items:center; gap:13px; padding:14px 15px; text-align:left;
    cursor:pointer; background:transparent; border:none; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .box { width:26px; height:26px; border-radius:999px; flex-shrink:0; border:1.5px solid var(--line);
    display:inline-flex; align-items:center; justify-content:center; transition:background .15s,border .15s; }
  .box.on { border:none; background:var(--done); }
  .box svg { display:none; }
  .box.on svg { display:block; }
  .txt { display:flex; flex-direction:column; gap:2px; flex:1; min-width:0; }
  .t { font-size:15px; font-weight:500; }
  .d { font-size:12.5px; color:var(--soft); }
  .time { font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; white-space:nowrap; margin-left:6px; }
  .row.done .t { color:var(--faint); text-decoration:line-through; }
  .row.done .d { color:var(--faint); }
  .row.done .time { color:var(--faint); }
  .done-note { margin-top:14px; text-align:center; font-size:14px; font-weight:600; }
  .panel { margin-top:22px; padding:15px 16px; border-radius:16px; background:var(--card); border:1px solid var(--line); }
  .panel-h { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--faint); font-weight:700; margin-bottom:10px; }
  .dots { display:flex; gap:5px; flex-wrap:wrap; }
  .dot { width:15px; height:15px; border-radius:5px; background:var(--line); }
  .hist-foot { margin-top:12px; font-size:12.5px; color:var(--soft); }
  .floor { margin-top:14px; padding:14px 16px; border-radius:14px; background:var(--card); border:1px solid var(--line); }
  .floor .panel-h { margin-bottom:6px; }
  .floor p { margin:0; font-size:13.5px; color:var(--soft); line-height:1.5; }
  .foot { margin-top:14px; text-align:center; font-size:11.5px; color:var(--faint); }
</style>
</head>

var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

};

var now = new Date();
var dayIdx = now.getDay();
var treatment = TREAT[dayIdx];

// iron every other day; anchor Aug 9 2026 = iron day (taken that day)
var IRON_ANCHOR = new Date(2026,7,9);
function isIronDay(dsStr){
  var p = dsStr.split("-");
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  var diff = Math.round((d - IRON_ANCHOR)/86400000);
  return ((((diff % 2)+2)%2) === 0);
}

  {sec:"Fuel", items:[

    {id:"am-fuel", t:"Coffee + fiber + creatine", time:"6:00 AM"},

var STORE = "routine-data";
var data = {};
try { data = JSON.parse(localStorage.getItem(STORE)) || {}; } catch(e){ data = {}; }

function pad(n){ return n<10 ? "0"+n : ""+n; }
function ds(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
var today = ds(now);
var period = now.getHours() >= 14 ? "pm" : "am";

var allItems = [];
AM.concat(PM).forEach(function(s){ s.items.forEach(function(it){ allItems.push(it); }); });
var baseRequired = allItems.filter(function(it){ return !it.optional && !it.iron; }).length;

function save(){ try { localStorage.setItem(STORE, JSON.stringify(data)); } catch(e){} }
function checked(date, id){ return !!(data[date] && data[date][id]); }
function essDone(date){ return checked(date,"am-spf") && checked(date,"pm-cleanse"); }
function requiredCount(date){ return baseRequired + (isIronDay(date)?1:0); }
function checkedRequired(date){
  var c=0;
  allItems.forEach(function(it){
    if(it.optional) return;
    if(it.iron && !isIronDay(date)) return;
    if(checked(date, it.id)) c++;
  });
  return c;
}
function dayPct(date){ var r=requiredCount(date); return r? checkedRequired(date)/r : 0; }

function currentStreak(){
  var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var s = 0;
  if(!essDone(ds(d))){ d.setDate(d.getDate()-1); }
  while(essDone(ds(d))){ s++; d.setDate(d.getDate()-1); }
  return s;
}
function bestStreak(){
  var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  d.setDate(d.getDate()-364);
  var best=0, run=0;
  for(var i=0;i<=364;i++){
    if(essDone(ds(d))){ run++; if(run>best) best=run; } else { run=0; }
    d.setDate(d.getDate()+1);
  }
  return best;
}

function toggle(id){
  if(!data[today]) data[today] = {};
  if(data[today][id]) delete data[today][id]; else data[today][id] = true;
  save();
  render();
}
function mix(a,b,t){
  return "rgb("+Math.round(a[0]*(1-t)+b[0]*t)+","+Math.round(a[1]*(1-t)+b[1]*t)+","+Math.round(a[2]*(1-t)+b[2]*t)+")";
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function render(){
  var isAM = period==="am";
  var accent = isAM ? "#B0842E" : "#8195BC";
  var sections = isAM ? AM : PM;
  var hbg = isAM
    ? "linear-gradient(160deg,#F3E3BE 0%,#ECE6D3 55%,#EDF1EC 100%)"
    : "linear-gradient(160deg,#384A61 0%,#4B5970 55%,#69768A 100%)";
  var hink = isAM ? "#25332D" : "#EEF2ED";
  var hsoft = isAM ? "#7C6A3E" : "#C9D2E1";

  var reqInPeriod = 0, doneInPeriod = 0;
  sections.forEach(function(s){ s.items.forEach(function(it){
    if(it.optional) return;
    if(it.iron && !isIronDay(today)) return;
    reqInPeriod++; if(checked(today, it.id)) doneInPeriod++;
  }); });
  var pct = reqInPeriod ? Math.round(doneInPeriod/reqInPeriod*100) : 0;
  var allDone = reqInPeriod>0 && doneInPeriod===reqInPeriod;

  var cs = currentStreak(), bs = bestStreak();

  var checkSvg = "<svg width='14' height='14' viewBox='0 0 24 24' fill='none'><path d='M5 13l4 4L19 7' stroke='#F6F8F5' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>";
  var flame = "<svg width='16' height='16' viewBox='0 0 24 24' fill='"+accent+"'><path d='M12 2s5 4 5 9a5 5 0 01-10 0c0-1.5.7-2.8 1.5-3.5C8 9 9 10 9 11c0-2 1.5-4 3-5-.5 1.5 0 2.5 1 3 .3-2-1-4-1-7z'/></svg>";
  var moon = "<svg width='15' height='15' viewBox='0 0 24 24' fill='none'><path d='M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z' fill='"+(isAM?"#B0842E":"#C9D2E1")+"'/></svg>";

  var h = "";
  h += "<div class='header' style='background:"+hbg+";color:"+hink+"'>";
  h += "<div class='eyebrow' style='color:"+hsoft+"'>"+(isAM?"Good morning":"Good evening")+"</div>";
  h += "<div class='day'>"+DAYS[dayIdx]+"</div>";
  h += "<div class='date' style='color:"+hsoft+"'>"+MONTHS[now.getMonth()]+" "+now.getDate()+"</div>";
  h += "<div class='treat' style='background:"+(isAM?"rgba(255,255,255,.45)":"rgba(255,255,255,.12)")+"'>"+moon+
       "<div><div class='lab'>Tonight: "+esc(treatment.label)+"</div><div class='det' style='color:"+hsoft+"'>"+esc(treatment.detail)+"</div></div></div>";
  h += "<div class='streak'>"+flame+"<span style='color:"+hink+"'>"+cs+"-day streak</span></div>";
  h += "</div>";

  h += "<div class='toggle'>";
  h += "<button data-period='am' class='"+(isAM?"on-am":"")+"'>Morning</button>";
  h += "<button data-period='pm' class='"+(!isAM?"on-pm":"")+"'>Evening</button>";
  h += "</div>";

  h += "<div class='prog'><div class='bar'><div class='fill' style='width:"+pct+"%;background:"+accent+"'></div></div><div class='count'>"+doneInPeriod+" of "+reqInPeriod+"</div></div>";

  sections.forEach(function(s){
    var rows = "";
    s.items.forEach(function(it){
      if(it.iron && !isIronDay(today)) return;
      var on = checked(today, it.id);
      var bg = it.treatment ? (isAM?"rgba(176,132,46,.06)":"rgba(129,149,188,.09)") : "transparent";
      var det = "";
      if(it.essential) det += "<span style='color:"+accent+";font-weight:600'>Essential</span>";
      if(it.optional) det += "<span style='color:var(--faint)'>Optional</span>";
      if(it.d){ det += (det? " &middot; ":"") + esc(it.d); }
      rows += "<button class='row"+(on?" done":"")+"' data-toggle='"+it.id+"' style='background:"+bg+"'>";
      rows += "<span class='box"+(on?" on":"")+"'>"+checkSvg+"</span>";
      rows += "<span class='txt'><span class='t'"+(it.treatment?" style='font-weight:600'":"")+">"+esc(it.t)+"</span>"+(det?"<span class='d'>"+det+"</span>":"")+"</span>";
      if(it.time){ rows += "<span class='time'>"+esc(it.time)+"</span>"; }
      rows += "</button>";
    });
    if(rows){ h += "<div class='sec'><div class='sec-h'>"+esc(s.sec)+"</div><div class='list'>"+rows+"</div></div>"; }
  });

  if(allDone){
    h += "<div class='done-note' style='color:"+accent+"'>"+(isAM?"Morning routine done. Go start your day.":"Night routine done. Go read.")+"</div>";
  }

  var low=[236,240,236], hi=[110,154,107];
  h += "<div class='panel'><div class='panel-h'>Last 14 days</div><div class='dots'>";
  var d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  d0.setDate(d0.getDate()-13);
  for(var i=0;i<14;i++){
    var p = dayPct(ds(d0));
    var col = p===0 ? "var(--line)" : mix(low, hi, 0.25+0.75*p);
    h += "<div class='dot' title='"+ds(d0)+"' style='background:"+col+"'></div>";
    d0.setDate(d0.getDate()+1);
  }
  h += "</div><div class='hist-foot'>Current streak "+cs+" days &middot; Best "+bs+" days. A day counts once both essentials are done.</div></div>";

  h += "<div class='floor'><div class='panel-h'>The floor</div><p>Sunscreen in the morning, cleanse at night. On a low day, the floor plus moisturizer still counts as a win.</p></div>";
  h += "<div class='foot'>Saves on this device. Checks reset each morning; streak and history are kept.</div>";

  document.getElementById("app").innerHTML = h;
}

document.getElementById("app").addEventListener("click", function(e){
  var t = e.target.closest("[data-toggle]");
  if(t){ toggle(t.getAttribute("data-toggle")); return; }
  var p = e.target.closest("[data-period]");
  if(p){ period = p.getAttribute("data-period"); render(); }
});

render();
</script>
</body>
</html>
