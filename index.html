  .date { font-size:13px; margin-top:4px; }
  .treat { margin-top:16px; display:flex; align-items:center; gap:8px; border-radius:14px; padding:10px 12px; }
  .treat .lab { font-size:14px; font-weight:600; }
  .treat .det { font-size:12px; }
  .streak { display:flex; align-items:center; gap:6px; margin-top:14px; font-size:13px; font-weight:600; }
  .points { margin-top:14px; display:flex; align-items:center; justify-content:space-between;
    border-radius:16px; padding:14px 16px; background:var(--card); border:1px solid var(--line); }
  .bank { display:flex; align-items:baseline; gap:6px; }
  .bank-num { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
  .bank-lab { font-size:12px; color:var(--soft); text-transform:uppercase; letter-spacing:1px; }
  .week { font-size:13px; color:var(--soft); font-weight:600; }
  .toggle { display:flex; gap:8px; margin-top:14px; }
  .toggle button { flex:1; padding:11px 0; border-radius:13px; cursor:pointer; font-size:14px;
    font-weight:600; letter-spacing:.3px; border:1.5px solid var(--line); background:var(--card); color:var(--soft); }
  .toggle button.on-am { border-color:var(--am); background:var(--am); color:#F6F8F5; }
  .toggle button.on-pm { border-color:var(--pm); background:var(--pm); color:#F6F8F5; }
  .prog { display:flex; align-items:center; gap:10px; margin:18px 4px 12px; }
  .bar { flex:1; height:5px; border-radius:999px; background:var(--line); overflow:hidden; }
  .fill { height:100%; border-radius:999px; transition:width .2s ease; }
  .count { font-size:12px; color:var(--soft); font-variant-numeric:tabular-nums; }
  .sec { margin-top:16px; }
  .sec-h { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; font-weight:700; color:var(--faint); margin:0 6px 7px; }
  .list { background:var(--card); border-radius:18px; border:1px solid var(--line); overflow:hidden; }
  .row { width:100%; display:flex; align-items:center; gap:13px; padding:14px 15px; text-align:left;
    cursor:pointer; background:transparent; border:none; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .box { width:26px; height:26px; border-radius:999px; flex-shrink:0; border:1.5px solid var(--line);
    display:inline-flex; align-items:center; justify-content:center; transition:background .15s,border .15s; }
  .box.on { border:none; background:var(--done); }
  .box svg { display:none; }
  .box.on svg { display:block; }
  .txt { display:flex; flex-direction:column; gap:2px; flex:1; min-width:0; }
  .t { font-size:15px; font-weight:500; }
  .d { font-size:12.5px; color:var(--soft); }
  .time { font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; white-space:nowrap; margin-left:6px; }
  .row.done .t { color:var(--faint); text-decoration:line-through; }
  .row.done .d { color:var(--faint); }
  .row.done .time { color:var(--faint); }
  .done-note { margin-top:14px; text-align:center; font-size:14px; font-weight:600; }
  .panel { margin-top:22px; padding:15px 16px; border-radius:16px; background:var(--card); border:1px solid var(--line); }
  .panel-h { font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--faint); font-weight:700; margin-bottom:10px; }
  .dots { display:flex; gap:5px; flex-wrap:wrap; }
  .dot { width:15px; height:15px; border-radius:5px; background:var(--line); }
  .hist-foot { margin-top:12px; font-size:12.5px; color:var(--soft); }
  .bfrow { display:flex; gap:7px; flex-wrap:wrap; }
  .bfchip { font-size:12.5px; font-weight:600; padding:8px 11px; border-radius:11px; border:1.5px solid var(--pm); background:transparent; color:var(--pm); cursor:pointer; font-family:inherit; }
  .bfchip.done { border-color:var(--done); color:var(--done); background:rgba(110,154,107,0.08); cursor:default; }
  .reward { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
  .reward:last-of-type { border-bottom:none; }
  .r-name { font-size:14px; font-weight:600; }
  .r-cost { font-size:12px; color:var(--soft); margin-top:2px; }
  .redeem { border:1.5px solid var(--done); background:var(--done); color:#F6F8F5; border-radius:11px;
    padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; font-family:inherit; }
  .redeem[disabled] { border-color:var(--line); background:transparent; color:var(--faint); cursor:default; }
  .redlog { margin-top:10px; font-size:12px; color:var(--soft); }
  .floor { margin-top:14px; padding:14px 16px; border-radius:14px; background:var(--card); border:1px solid var(--line); }
  .floor .panel-h { margin-bottom:6px; }
  .floor p { margin:0; font-size:13.5px; color:var(--soft); line-height:1.5; }
  .foot { margin-top:16px; text-align:center; }
  .reset { background:none; border:none; color:var(--faint); font-size:12px; cursor:pointer; text-decoration:underline; font-family:inherit; }
  .foot-note { margin-top:10px; text-align:center; font-size:11.5px; color:var(--faint); }
  .cel { position:fixed; inset:0; z-index:50; background:rgba(20,28,24,0.82); display:flex; align-items:center; justify-content:center; }
  .cel-cv { position:absolute; inset:0; width:100%; height:100%; }
  .cel-msg { position:relative; text-align:center; padding:0 30px; }
  .cel-h { font-family:Georgia,"Times New Roman",serif; font-size:30px; color:#F6F8F5; }
  .cel-sub { font-size:15px; color:#D7E0D3; margin-top:10px; line-height:1.5; }
  .cel-x { font-size:12px; color:#9FB0A4; margin-top:22px; text-transform:uppercase; letter-spacing:2px; }
</style>
</head>

var now = new Date();
function pad(n){ return n<10 ? "0"+n : ""+n; }
function ds(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseDs(s){ var p=s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function dow(s){ return parseDs(s).getDay(); }
var today = ds(now);
var todayIdx = now.getDay();

function isIronDay(s){ var diff=Math.round((parseDs(s)-IRON_ANCHOR)/86400000); return ((((diff%2)+2)%2)===0); }
function isGuaDay(s){ return !!GUA_DAYS[dow(s)]; }
function choreItems(s){
  var di=dow(s); var it=[];
  if(di===1||di===4||di===6) it.push({id:"ch-vacuum", t:"Vacuum", time:"1:30 PM", chore:true, optional:true});
  if(di===2) it.push({id:"ch-dust", t:"Dust", time:"1:30 PM", chore:true, optional:true});
  if(di===3) it.push({id:"ch-tidy", t:"Tidy / wipe down", time:"1:30 PM", chore:true, optional:true});
  if(di===5) it.push({id:"ch-laundry", t:"Laundry", time:"10:00 AM", chore:true, optional:true});

  return it;
}
function choreSection(s){ var it=choreItems(s); return it.length ? {sec:"Home", items:it} : null; }
function choreBonus(s){ var it=choreItems(s), c=0; for(var i=0;i<it.length;i++){ if(checked(s,it[i].id)) c++; } return c*5; }

function amSections(s){

function pmSections(s){

  var tr = TREAT[di];

}
function dayAll(s){
  var all=[]; amSections(s).concat(pmSections(s)).forEach(function(x){ x.items.forEach(function(i){ all.push(i); }); });
  return all;
}
function reqNonRest(s){ return dayAll(s).filter(function(i){ return !i.optional && !i.rest && (!i.since || s>=i.since); }); }
function restItems(s){ return dayAll(s).filter(function(i){ return i.rest; }); }

var STORE="routine-data", RSTORE="routine-redeemed", LSTORE="routine-redlog";

try { data = JSON.parse(localStorage.getItem(STORE)) || {}; } catch(e){ data={}; }
try { redeemed = parseInt(localStorage.getItem(RSTORE),10) || 0; } catch(e){ redeemed=0; }
try { redlog = JSON.parse(localStorage.getItem(LSTORE)) || []; } catch(e){ redlog=[]; }

function save(){ try { localStorage.setItem(STORE, JSON.stringify(data)); } catch(e){} }

function checked(date,id){ return !!(data[date] && data[date][id]); }
function essDone(s){ return checked(s,"am-spf") && checked(s,"pm-cleanse"); }
function allChecked(items,s){ for(var i=0;i<items.length;i++){ if(!checked(s,items[i].id)) return false; } return true; }
function perfect(s){
  var base = allChecked(reqNonRest(s), s);
  if(dow(s)===0){ var r=restItems(s); var one=false; for(var i=0;i<r.length;i++){ if(checked(s,r[i].id)) one=true; } return base && one; }
  return base;
}
function sundayAll3(s){ if(dow(s)!==0) return false; return allChecked(restItems(s), s); }

function earnedPoints(){
  var d = parseDs(START_DATE);
  var end = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var pts=0, run=0, gap=0;
  while(d<=end){
    var s=ds(d);
    if(essDone(s)){ run++; gap=0; pts+=10; if(perfect(s))pts+=5; if(sundayAll3(s))pts+=5; if(run%7===0)pts+=25; }
    else { gap++; if(gap>=2) run=0; }
    pts += choreBonus(s);
    d.setDate(d.getDate()+1);
  }
  return pts;
}
function weekPoints(){
  var off = (todayIdx===0?6:todayIdx-1);
  var d = new Date(now.getFullYear(), now.getMonth(), now.getDate()); d.setDate(d.getDate()-off);
  var end = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var pts=0;
  while(d<=end){
    var s=ds(d);
    if(s>=START_DATE && essDone(s)){ pts+=10; if(perfect(s))pts+=5; if(sundayAll3(s))pts+=5; }
    if(s>=START_DATE) pts += choreBonus(s);
    d.setDate(d.getDate()+1);
  }
  return pts;
}
function currentStreak(){
  var d = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if(!essDone(ds(d))){ d.setDate(d.getDate()-1); }
  var s=0, gap=0;
  while(ds(d)>=START_DATE){
    if(essDone(ds(d))){ s++; gap=0; }
    else { gap++; if(gap>=2) break; }
    d.setDate(d.getDate()-1);
  }
  return s;
}
function bestStreak(){
  var d = parseDs(START_DATE);
  var end = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var best=0, run=0, gap=0;
  while(d<=end){
    if(essDone(ds(d))){ run++; gap=0; if(run>best)best=run; }
    else { gap++; if(gap>=2) run=0; }
    d.setDate(d.getDate()+1);
  }
  return best;
}
function dayPctVis(s){ var rn=reqNonRest(s); if(!rn.length) return 0; var c=0; for(var i=0;i<rn.length;i++){ if(checked(s,rn[i].id))c++; } return c/rn.length; }
function bank(){ var b = earnedPoints()-redeemed; return b<0?0:b; }
function backfillDay(s){
  if(s>=START_DATE){
    if(!data[s]) data[s]={};
    var items = dayAll(s);
    for(var i=0;i<items.length;i++){ if(!items[i].optional) data[s][items[i].id]=true; }
    save(); render();
  }
}

var period = now.getHours() >= 14 ? "pm" : "am";
var resetArmed = false;

function toggle(id){
  if(!data[today]) data[today]={};
  if(data[today][id]) delete data[today][id]; else data[today][id]=true;
  save(); render();
}
function redeem(rid){
  var r=null; for(var i=0;i<REWARDS.length;i++){ if(REWARDS[i].id===rid) r=REWARDS[i]; }
  if(!r) return;
  if(bank() >= r.cost){
    redeemed += r.cost;
    redlog.unshift({name:r.name, cost:r.cost, date:today});
    if(redlog.length>5) redlog = redlog.slice(0,5);
    saveRedeem(); render();
  }
}
function doReset(){
  if(!resetArmed){ resetArmed=true; render(); return; }
  data={}; redeemed=0; redlog=[]; celebrated=0;
  try { localStorage.removeItem(STORE); localStorage.removeItem(RSTORE); localStorage.removeItem(LSTORE); localStorage.removeItem(CEL_STORE); } catch(e){}
  resetArmed=false; render();
}
function mix(a,b,t){ return "rgb("+Math.round(a[0]*(1-t)+b[0]*t)+","+Math.round(a[1]*(1-t)+b[1]*t)+","+Math.round(a[2]*(1-t)+b[2]*t)+")"; }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

var CEL_STORE="routine-cel";
var celebrated=0;
try { celebrated = parseInt(localStorage.getItem(CEL_STORE),10) || 0; } catch(e){ celebrated=0; }

function celebrate(weeks){
  var ov=document.createElement("div"); ov.className="cel";
  ov.innerHTML="<canvas class='cel-cv'></canvas><div class='cel-msg'><div class='cel-h'>A full week, complete</div><div class='cel-sub'>"+weeks+" week"+(weeks>1?"s":"")+" in a row. Your habits are taking root.</div><div class='cel-x'>tap to close</div></div>";
  document.body.appendChild(ov);
  var cv=ov.querySelector(".cel-cv"); var ctx=cv.getContext("2d");
  var W=cv.width=window.innerWidth, H=cv.height=window.innerHeight;
  var cols=["#ffff77","#C6E246","#6E9A6B","#B0842E","#8195BC","#F6F8F5"];
  var parts=[], running=true;
  function burst(x,y){ var c=cols[Math.floor(Math.random()*cols.length)]; for(var i=0;i<54;i++){ var a=Math.random()*Math.PI*2, sp=Math.random()*4+1.2; parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,col:(Math.random()<0.3?cols[Math.floor(Math.random()*cols.length)]:c)}); } }
  function loop(){ if(!running) return; ctx.fillStyle="rgba(20,28,24,0.20)"; ctx.fillRect(0,0,W,H); for(var i=0;i<parts.length;i++){ var p=parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.03; p.life-=0.011; if(p.life<0)p.life=0; ctx.globalAlpha=p.life; ctx.fillStyle=p.col; ctx.fillRect(p.x,p.y,3,3); } ctx.globalAlpha=1; parts=parts.filter(function(p){return p.life>0;}); requestAnimationFrame(loop); }
  loop();
  burst(W*0.5, H*0.35);
  var shots=0; var iv=setInterval(function(){ burst(W*(0.2+Math.random()*0.6), H*(0.18+Math.random()*0.4)); shots++; if(shots>=6) clearInterval(iv); }, 480);
  function close(){ running=false; clearInterval(iv); if(ov.parentNode) ov.parentNode.removeChild(ov); }
  ov.addEventListener("click", close);
  setTimeout(close, 6500);
}

function render(){
  var isAM = period==="am";
  var accent = isAM ? "#B0842E" : "#8195BC";
  var sections = (isAM ? amSections(today) : pmSections(today)).slice();
  var choreSec = choreSection(today); if(choreSec) sections = sections.concat([choreSec]);
  var hbg = isAM
    ? "linear-gradient(160deg,#F3E3BE 0%,#ECE6D3 55%,#EDF1EC 100%)"
    : "linear-gradient(160deg,#384A61 0%,#4B5970 55%,#69768A 100%)";
  var hink = isAM ? "#25332D" : "#EEF2ED";
  var hsoft = isAM ? "#7C6A3E" : "#C9D2E1";
  var tr = TREAT[todayIdx];

  var reqInPeriod=0, doneInPeriod=0;
  sections.forEach(function(sc){ sc.items.forEach(function(it){
    if(it.optional) return;
    reqInPeriod++; if(checked(today,it.id)) doneInPeriod++;
  }); });
  var pct = reqInPeriod ? Math.round(doneInPeriod/reqInPeriod*100) : 0;
  var allDone = reqInPeriod>0 && doneInPeriod===reqInPeriod;
  var cs=currentStreak(), bs=bestStreak(), bnk=bank(), wk=weekPoints();
  if(cs>0 && cs%7===0 && cs>celebrated){ celebrated=cs; try{localStorage.setItem(CEL_STORE,""+cs);}catch(e){} setTimeout(function(){ celebrate(cs/7); }, 400); }

  var checkSvg = "<svg width='14' height='14' viewBox='0 0 24 24' fill='none'><path d='M5 13l4 4L19 7' stroke='#F6F8F5' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/></svg>";
  var flame = "<svg width='16' height='16' viewBox='0 0 24 24' fill='"+accent+"'><path d='M12 2s5 4 5 9a5 5 0 01-10 0c0-1.5.7-2.8 1.5-3.5C8 9 9 10 9 11c0-2 1.5-4 3-5-.5 1.5 0 2.5 1 3 .3-2-1-4-1-7z'/></svg>";
  var moon = "<svg width='15' height='15' viewBox='0 0 24 24' fill='none'><path d='M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z' fill='"+(isAM?"#B0842E":"#C9D2E1")+"'/></svg>";

  var h="";
  h += "<div class='header' style='background:"+hbg+";color:"+hink+"'>";
  h += "<div class='eyebrow' style='color:"+hsoft+"'>"+(isAM?"Good morning":"Good evening")+"</div>";
  h += "<div class='day'>"+DAYS[todayIdx]+"</div>";
  h += "<div class='date' style='color:"+hsoft+"'>"+MONTHS[now.getMonth()]+" "+now.getDate()+"</div>";
  h += "<div class='treat' style='background:"+(isAM?"rgba(255,255,255,.45)":"rgba(255,255,255,.12)")+"'>"+moon+
       "<div><div class='lab'>Tonight: "+esc(tr.label)+"</div><div class='det' style='color:"+hsoft+"'>"+esc(tr.detail)+"</div></div></div>";
  h += "<div class='streak'>"+flame+"<span style='color:"+hink+"'>"+cs+"-day streak</span></div>";
  h += "</div>";

  h += "<div class='points'><div class='bank'><span class='bank-num' style='color:"+accent+"'>"+bnk+"</span><span class='bank-lab'>points</span></div><div class='week'>+"+wk+" this week</div></div>";

  h += "<div class='toggle'>";
  h += "<button data-period='am' class='"+(isAM?"on-am":"")+"'>Morning</button>";
  h += "<button data-period='pm' class='"+(!isAM?"on-pm":"")+"'>Evening</button>";
  h += "</div>";

  h += "<div class='prog'><div class='bar'><div class='fill' style='width:"+pct+"%;background:"+accent+"'></div></div><div class='count'>"+doneInPeriod+" of "+reqInPeriod+"</div></div>";

  sections.forEach(function(sc){
    var rows="";
    sc.items.forEach(function(it){
      var on = checked(today,it.id);
      var bg = it.treatment ? (isAM?"rgba(176,132,46,.06)":"rgba(129,149,188,.09)") : "transparent";
      var det="";
      if(it.essential) det += "<span style='color:"+accent+";font-weight:600'>Essential</span>";
      if(it.chore) det += "<span style='color:"+accent+";font-weight:600'>+5 bonus</span>";
      else if(it.optional) det += "<span style='color:var(--faint)'>Optional</span>";
      if(it.d){ det += (det? " &middot; ":"") + esc(it.d); }
      rows += "<button class='row"+(on?" done":"")+"' data-toggle='"+it.id+"' style='background:"+bg+"'>";
      rows += "<span class='box"+(on?" on":"")+"'>"+checkSvg+"</span>";
      rows += "<span class='txt'><span class='t'"+(it.treatment?" style='font-weight:600'":"")+">"+esc(it.t)+"</span>"+(det?"<span class='d'>"+det+"</span>":"")+"</span>";
      if(it.time){ rows += "<span class='time'>"+esc(it.time)+"</span>"; }
      rows += "</button>";
    });
    if(rows){ h += "<div class='sec'><div class='sec-h'>"+esc(sc.sec)+"</div><div class='list'>"+rows+"</div></div>"; }
  });

  if(choreSec){
    h += "<div class='hist-foot' style='margin:12px 4px 0'>Home tasks earn bonus points and do not affect your streak.</div>";
  }
  if(todayIdx===0 && !isAM){
    h += "<div class='hist-foot' style='margin:12px 4px 0'>Active rest: do any one to keep your streak, all three for +5 bonus points.</div>";
  }

  if(allDone){
    h += "<div class='done-note' style='color:"+accent+"'>"+(isAM?"Morning done. Go start your day.":"Night done. Go read.")+"</div>";
  }

  // rewards
  h += "<div class='panel'><div class='panel-h'>Rewards</div>";
  REWARDS.forEach(function(r){
    var can = bnk >= r.cost;
    h += "<div class='reward'><div><div class='r-name'>"+esc(r.name)+"</div><div class='r-cost'>"+r.cost+" pts</div></div>";
    h += "<button class='redeem' data-redeem='"+r.id+"'"+(can?"":" disabled")+">"+(can?"Redeem":(r.cost-bnk)+" to go")+"</button></div>";
  });
  if(redlog.length){ h += "<div class='redlog'>Last redeemed: "+esc(redlog[0].name)+" ("+redlog[0].cost+" pts)</div>"; }
  h += "</div>";

  // history
  var low=[236,240,236], hi=[110,154,107];
  h += "<div class='panel'><div class='panel-h'>Last 14 days</div><div class='dots'>";
  var d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()); d0.setDate(d0.getDate()-13);
  for(var i=0;i<14;i++){
    var s0=ds(d0);
    var p = (s0>=START_DATE) ? dayPctVis(s0) : 0;
    var col = p===0 ? "var(--line)" : mix(low, hi, 0.25+0.75*p);
    h += "<div class='dot' title='"+s0+"' style='background:"+col+"'></div>";
    d0.setDate(d0.getDate()+1);
  }
  h += "</div><div class='hist-foot'>Current streak "+cs+" days &middot; Best "+bs+" days. One missed day is forgiven; two in a row breaks it.</div></div>";

  // backfill last 7 days
  var chips=[];
  var bd = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var SD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  for(var bi=1; bi<=7; bi++){
    var cd = new Date(bd.getFullYear(), bd.getMonth(), bd.getDate()-bi);
    var cds = ds(cd);
    if(cds < START_DATE) continue;
    var lab = SD[cd.getDay()]+" "+cd.getDate();
    if(essDone(cds)){ chips.push("<span class='bfchip done'>"+lab+"</span>"); }
    else { chips.push("<button class='bfchip' data-backfill='"+cds+"'>"+lab+"</button>"); }
  }
  if(chips.length){
    h += "<div class='panel'><div class='panel-h'>Backfill a day</div><div class='bfrow'>"+chips.join("")+"</div><div class='hist-foot'>Did a day but couldn't log it in time? Tap it to mark it complete. Green days already count.</div></div>";
  }

  h += "<div class='floor'><div class='panel-h'>The floor</div><p>Sunscreen in the morning, cleanse at night. On a low day, the floor plus moisturizer still counts as a win and keeps your streak.</p></div>";

  h += "<div class='foot'><button class='reset' data-reset>"+(resetArmed?"Tap again to erase everything":"Reset all data")+"</button></div>";
  h += "<div class='foot-note'>Saves on this device. Checks reset each morning; streak, history, and points are kept. &middot; build 0811-6</div>";

  document.getElementById("app").innerHTML = h;
}

document.getElementById("app").addEventListener("click", function(e){
  var t=e.target.closest("[data-toggle]"); if(t){ toggle(t.getAttribute("data-toggle")); return; }
  var rd=e.target.closest("[data-redeem]"); if(rd){ redeem(rd.getAttribute("data-redeem")); return; }
  var rs=e.target.closest("[data-reset]"); if(rs){ doReset(); return; }
  var bf=e.target.closest("[data-backfill]"); if(bf){ var bday=bf.getAttribute("data-backfill"); if(window.confirm("Mark "+bday+" as a completed day? Only do this for a day you actually did.")){ backfillDay(bday); } return; }
  var p=e.target.closest("[data-period]"); if(p){ period=p.getAttribute("data-period"); resetArmed=false; render(); }
});

render();
</script>
</body>
</html>
